services:

  backend:
    container_name: backend
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./config.default.yaml:/config.default.yaml:ro
    expose:
      - "8000"
    depends_on:
      pg:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      app-network: {}
      edge-proxy:
        aliases:
          - backlog-backend

  worker:
    container_name: worker
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./config.default.yaml:/config.default.yaml:ro
      - ./config.local.yaml:/config.local.yaml:ro
    command: uv run taskiq worker backlog_app.taskiq_broker:broker --no-configure-logging
    depends_on:
      rabbitmq:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    container_name: frontend
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      app-network: {}
      edge-proxy:
        aliases:
          - backlog-frontend

  pg:
    container_name: pg
    image: postgres:18
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/18/docker
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/18/docker
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:4.2-alpine
    hostname: rabbitmq
    container_name: rabbitmq
    expose:
      - "5672"
    env_file:
      - .env
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - app-network

volumes:
  pgdata:
  rabbitmq-data:

networks:
  app-network:
    driver: bridge
  edge-proxy:
    external: true
    name: edge-proxy
